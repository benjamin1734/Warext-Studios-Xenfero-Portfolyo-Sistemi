name: fix-release-1.0.1
on:
  push:
    branches: [diagnose-1.0.1]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == '1.0.1-fix-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnose-1.0.1
          fetch-depth: 0
      - name: Apply compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib,os
          root=Path('.')
          mapping={
          'wrxtPortfolioDiskReserveMb':'wrxtPfDiskReserveMb',
          'wrxtPortfolioUploadSessionMinutes':'wrxtPfUploadMins',
          'wrxtPortfolioQuarantineHours':'wrxtPfQuarantineHrs',
          'wrxtPortfolioMaxImageWidth':'wrxtPfImgMaxW',
          'wrxtPortfolioMaxImageHeight':'wrxtPfImgMaxH',
          'wrxtPortfolioMaxImageMegapixels':'wrxtPfImgMaxMp',
          'wrxtPortfolioClamAvMode':'wrxtPfClamMode',
          'wrxtPortfolioClamAvSocket':'wrxtPfClamSocket',
          'wrxtPortfolioClamAvHost':'wrxtPfClamHost',
          'wrxtPortfolioClamAvPort':'wrxtPfClamPort',
          'wrxtPortfolioClamAvConnectTimeout':'wrxtPfClamConnTimeout',
          'wrxtPortfolioClamAvReadTimeout':'wrxtPfClamReadTimeout',
          'wrxtPortfolioWorkerPhpPath':'wrxtPfWorkerPhp',
          'wrxtPortfolioWorkerMemoryMb':'wrxtPfWorkerMemMb',
          'wrxtPortfolioWorkerTimeoutSeconds':'wrxtPfWorkerTimeout',
          'wrxtPortfolioDisplayMaxDimension':'wrxtPfDisplayMaxDim',
          'wrxtPortfolioThumbnailMaxDimension':'wrxtPfThumbMaxDim',
          'wrxtPortfolioWebpQuality':'wrxtPfWebpQuality',
          'wrxtPortfolioProcessingRetryMinutes':'wrxtPfProcRetryMins',
          'wrxtPortfolioMaxModelVertices':'wrxtPfModelVertices',
          'wrxtPortfolioMaxModelTriangles':'wrxtPfModelTriangles',
          'wrxtPortfolioMaxModelMeshes':'wrxtPfModelMeshes',
          'wrxtPortfolioMaxModelPrimitives':'wrxtPfModelPrimitives',
          'wrxtPortfolioMaxModelNodes':'wrxtPfModelNodes',
          'wrxtPortfolioMaxModelMaterials':'wrxtPfModelMaterials',
          'wrxtPortfolioMaxModelTextures':'wrxtPfModelTextures',
          'wrxtPortfolioMaxModelAnimations':'wrxtPfModelAnimations',
          'wrxtPortfolioMaxModelSkins':'wrxtPfModelSkins',
          'wrxtPortfolioMaxModelJoints':'wrxtPfModelJoints',
          'wrxtPortfolioMaxModelAccessors':'wrxtPfModelAccessors',
          'wrxtPortfolioMaxModelBufferViews':'wrxtPfModelBufViews',
          'wrxtPortfolioMaxModelAccessorElements':'wrxtPfModelAccElems',
          'wrxtPortfolioMaxModelTextureDimension':'wrxtPfModelTexDim',
          'wrxtPortfolioMaxModelTextureBytes':'wrxtPfModelTexBytes',
          'wrxtPortfolioMaxModelAnimationKeyframes':'wrxtPfModelAnimKeys',
          'wrxtPortfolioMaxModelNodeDepth':'wrxtPfModelNodeDepth',
          'wrxtPortfolioBlobGcGraceHours':'wrxtPfBlobGcHours',
          'wrxtPortfolioRescanDays':'wrxtPfRescanDays',
          'wrxt_portfolio_profile_button':'wrxt_pf_profile_btn'
          }
          exts={'.php','.xml','.json','.js','.md','.yml','.yaml','.txt'}
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts or '.git' in p.parts or p.name=='hashes.json': continue
              try: s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              n=s
              for a,b in mapping.items(): n=n.replace(a,b)
              n=n.replace('1000100','1000101').replace('1.0.0','1.0.1')
              if n!=s: p.write_text(n,encoding='utf-8')
          addon=Path('upload/src/addons/Warext/Portfolio/addon.json')
          d=json.loads(addon.read_text())
          d['version_id']=1000101; d['version_string']='1.0.1'
          addon.write_text(json.dumps(d,ensure_ascii=False,indent=4)+'\n')
          defaults=Path('upload/src/addons/Warext/Portfolio/Setup/DefaultsTrait.php')
          s=defaults.read_text()
          s=s.replace("        $this->applyDefaultPermissions();\n",'')
          defaults.write_text(s)
          tm=Path('upload/src/addons/Warext/Portfolio/_data/template_modifications.xml')
          assert 'wrxt_pf_profile_btn' in tm.read_text()
          opt=Path('upload/src/addons/Warext/Portfolio/_data/options.xml').read_text()
          ids=re.findall(r'option_id="([^"]+)"',opt)
          bad=[x for x in ids if len(x)>25]
          if bad: raise SystemExit('Option IDs over 25 remain: '+repr(bad))
          manifest={}
          upload=Path('upload')
          for p in sorted(upload.rglob('*')):
              if not p.is_file(): continue
              rel=p.relative_to(upload).as_posix()
              if rel=='src/addons/Warext/Portfolio/hashes.json': continue
              manifest[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          hp=Path('upload/src/addons/Warext/Portfolio/hashes.json')
          hp.write_text(json.dumps(manifest,indent=4,sort_keys=True)+'\n')
          readme=Path('README.md')
          if readme.exists():
              s=readme.read_text().replace('v1.0.0','v1.0.1').replace('1.0.0','1.0.1')
              readme.write_text(s)
          PY
      - name: Validate PHP XML JSON and identifiers
        run: |
          set -e
          find upload/src/addons/Warext/Portfolio -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          python3 - <<'PY'
          import os,json,xml.etree.ElementTree as ET,re
          root='upload/src/addons/Warext/Portfolio/_data'
          for fn in os.listdir(root):
              if fn.endswith('.xml'): ET.parse(os.path.join(root,fn))
          json.load(open('upload/src/addons/Warext/Portfolio/addon.json'))
          json.load(open('upload/src/addons/Warext/Portfolio/hashes.json'))
          opt=open(root+'/options.xml').read()
          ids=re.findall(r'option_id="([^"]+)"',opt)
          assert all(len(x)<=25 for x in ids), [(x,len(x)) for x in ids if len(x)>25]
          tm=ET.parse(root+'/template_modifications.xml')
          for e in tm.iter('modification'):
              assert len(e.attrib.get('modification_key',''))<=25
          PY
          ! grep -R -E 'wrxtPortfolio(DiskReserveMb|UploadSessionMinutes|QuarantineHours|MaxImageWidth|MaxImageHeight|MaxImageMegapixels|ClamAvConnectTimeout|ClamAvReadTimeout|WorkerPhpPath|WorkerMemoryMb|WorkerTimeoutSeconds|DisplayMaxDimension|ThumbnailMaxDimension|ProcessingRetryMinutes|MaxModel|BlobGcGraceHours)' upload --include='*.php' --include='*.xml' --include='*.js'
      - name: Build release archive
        run: |
          rm -rf dist
          mkdir -p dist build-release
          cp -a upload build-release/
          cp README.md build-release/
          cd build-release
          zip -qr ../dist/Warext-Studios-XenForo-Portfolyo-Sistemi-1.0.1.zip README.md upload
          cd ..
          unzip -t dist/Warext-Studios-XenForo-Portfolyo-Sistemi-1.0.1.zip >/dev/null
          sha256sum dist/Warext-Studios-XenForo-Portfolyo-Sistemi-1.0.1.zip > dist/SHA256SUMS.txt
      - name: Commit 1.0.1 to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name benjamin1734
          git config user.email muzafferbatingurnes@gmail.com
          rm -f .github/workflows/diagnose-xf-ids.yml .github/workflows/fix-release-1.0.1.yml
          git add -A
          git commit -m '1.0.1'
          git push origin HEAD:main --force
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.1 --yes 2>/dev/null || true
          git tag -f v1.0.1 HEAD
          git push origin refs/tags/v1.0.1 --force
          gh release create v1.0.1 dist/Warext-Studios-XenForo-Portfolyo-Sistemi-1.0.1.zip dist/SHA256SUMS.txt --title '1.0.1' --notes '1.0.1'
          gh api -X DELETE repos/${GITHUB_REPOSITORY}/git/refs/heads/diagnose-1.0.1 || true
