name: Bilingual Release Notes Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bilingual-release-notes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update v1.1.7 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view 'v1.1.7' --json body --jq .body > /tmp/current.md
          cat > /tmp/en.md <<'EOF'
Warext Studios XenForo Portfolio System 1.1.7

- The Portfolio comment area is connected to XenForo's normal attachment-manager quick-reply chain.
- `quick_reply_macros::body` now works with real `attachmentData`.
- The Add files control is generated by XenForo's core attachment manager.
- A real attachment content type and handler were added for `wrxt_portfolio_comment`.
- Temporary attachments are securely associated with the comment when it is submitted.
- Preview supports temporary attachments.
- Submitted attachments are rendered through `message_macros::attachments`.
- Existing installations receive the `attach_count` field automatically through migration.
- No manual SQL is required.
EOF
          python3 - <<'PY'
          from pathlib import Path
          base = Path('/tmp/current.md').read_text(encoding='utf-8').rstrip()
          marker = '\n\n---\n\n## English\n'
          if marker in base:
              base = base.split(marker, 1)[0].rstrip()
          en = Path('/tmp/en.md').read_text(encoding='utf-8').strip()
          Path('/tmp/final.md').write_text(base + marker + '\n' + en + '\n', encoding='utf-8')
          PY
          gh release edit 'v1.1.7' --notes-file /tmp/final.md
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/bilingual-release-notes.yml
          git commit -m 'Release notu geçici işini temizle' || exit 0
          git push || true
