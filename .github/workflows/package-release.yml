name: Package Portfolyo Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'upload/**'
      - '!upload/src/addons/Warext/Portfolio/hashes.json'
      - 'README.md'
      - '.github/workflows/package-release.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          with open('upload/src/addons/Warext/Portfolio/addon.json', encoding='utf-8') as f:
              print(json.load(f)['version_string'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find upload/src/addons/Warext/Portfolio -type f -name '*.php' -print0)

      - name: Validate XML and JSON data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('upload/src/addons/Warext/Portfolio')
          for path in root.rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          for path in (root / '_data').glob('*.xml'):
              ET.parse(path)
          print('JSON/XML validation OK')
          PY

      - name: Validate local template modification anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          data = Path('upload/src/addons/Warext/Portfolio/_data')
          templates_root = ET.parse(data / 'templates.xml').getroot()
          modifications_root = ET.parse(data / 'template_modifications.xml').getroot()
          templates = {node.attrib['title']: (node.text or '') for node in templates_root.findall('template')}
          failed = []
          checked = 0
          for mod in modifications_root.findall('modification'):
              title = mod.attrib.get('template', '')
              if title not in templates:
                  continue
              find_node = mod.find('find')
              needle = find_node.text if find_node is not None else ''
              checked += 1
              if not needle or needle not in templates[title]:
                  failed.append(f"{mod.attrib.get('modification_key')} -> {title}")
          if failed:
              raise SystemExit('Template modification anchor bulunamadı: ' + ', '.join(failed))
          print(f'Local template modification anchors OK ({checked})')
          PY

      - name: Regenerate XenForo file hashes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          upload = Path('upload')
          hash_file = upload / 'src/addons/Warext/Portfolio/hashes.json'
          roots = [upload / 'js/warext/portfolio', upload / 'src/addons/Warext/Portfolio']
          hashes = {}
          for root in roots:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path == hash_file:
                      continue
                  hashes[path.relative_to(upload).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          hash_file.write_text(json.dumps(hashes, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          PY

      - name: Build XenForo install ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          mkdir -p dist
          ZIP="dist/Warext-Studios-XenForo-Portfolyo-Sistemi-${VERSION}.zip"
          rm -f "$ZIP"
          zip -r -9 "$ZIP" README.md upload >/dev/null
          sha256sum "$ZIP" > dist/SHA256SUMS.txt
          unzip -t "$ZIP"

      - name: Commit packaged release
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/src/addons/Warext/Portfolio/hashes.json "dist/Warext-Studios-XenForo-Portfolyo-Sistemi-${VERSION}.zip" dist/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Release package already up to date.'
          else
            git commit -m "release: package Portfolyo ${VERSION}"
            git push
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          TAG="v${VERSION}"
          ZIP="dist/Warext-Studios-XenForo-Portfolyo-Sistemi-${VERSION}.zip"
          NOTES="Warext Studios XenForo Portfolyo Sistemi ${VERSION}\n\n- Her portfolyo yorumu bağımsız XenForo message kartı olarak gösteriliyor\n- Yorumların tek ortak kutuda birleşmesi kaldırıldı\n- Hızlı cevap editörü yorum listesinden ayrılarak ayrı block js-quickReply yapısına taşındı\n- Quick reply içinde XenForo block-container/block-body/message--quickReply hiyerarşisi kullanılıyor\n- message.less ve bb_code.less ile 1.1.2 yorum backend/raporlama geliştirmeleri korunuyor\n- Manuel SQL gerekmiyor"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$ZIP" dist/SHA256SUMS.txt --target main --title "$VERSION" --notes "$NOTES"
          fi
