name: Package Portfolyo Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'upload/**'
      - '!upload/src/addons/Warext/Portfolio/hashes.json'
      - 'README.md'
      - '.github/workflows/package-release.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          with open('upload/src/addons/Warext/Portfolio/addon.json', encoding='utf-8') as f:
              print(json.load(f)['version_string'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Regenerate XenForo file hashes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          upload = Path('upload')
          hash_file = upload / 'src/addons/Warext/Portfolio/hashes.json'
          roots = [
              upload / 'js/warext/portfolio',
              upload / 'src/addons/Warext/Portfolio'
          ]
          hashes = {}
          for root in roots:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path == hash_file:
                      continue
                  key = path.relative_to(upload).as_posix()
                  hashes[key] = hashlib.sha256(path.read_bytes()).hexdigest()
          hash_file.write_text(json.dumps(hashes, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          PY

      - name: Build XenForo install ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          mkdir -p dist
          ZIP="dist/Warext-Studios-XenForo-Portfolyo-Sistemi-${VERSION}.zip"
          rm -f "$ZIP"
          zip -r -9 "$ZIP" README.md upload >/dev/null
          sha256sum "$ZIP" > dist/SHA256SUMS.txt
          unzip -t "$ZIP"

      - name: Commit packaged release
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/src/addons/Warext/Portfolio/hashes.json \
            "dist/Warext-Studios-XenForo-Portfolyo-Sistemi-${VERSION}.zip" \
            dist/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Release package already up to date.'
          else
            git commit -m "release: package Portfolyo ${VERSION}"
            git push
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          TAG="v${VERSION}"
          ZIP="dist/Warext-Studios-XenForo-Portfolyo-Sistemi-${VERSION}.zip"
          NOTES="Warext Studios XenForo Portfolyo Sistemi ${VERSION}\n\n- Genel Portfolyo vitrini herkese açık\n- Kişisel Portfolyo işlemleri kullanıcı hesabı menüsünde\n- Varsayılan XenForo grup izinleri otomatik uygulanır\n- Yayınlanmış çalışma ve kullanıcı portfolyolarındaki gereksiz izin engeli kaldırıldı"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$ZIP" dist/SHA256SUMS.txt \
              --target main \
              --title "$VERSION" \
              --notes "$NOTES"
          fi
