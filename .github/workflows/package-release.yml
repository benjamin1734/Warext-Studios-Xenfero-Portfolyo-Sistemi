name: Package Portfolyo Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'upload/**'
      - '!upload/src/addons/Warext/Portfolio/hashes.json'
      - 'README.md'
      - '.github/workflows/package-release.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          with open('upload/src/addons/Warext/Portfolio/addon.json', encoding='utf-8') as f:
              print(json.load(f)['version_string'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare 1.1.6 native XenForo quick reply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('upload/src/addons/Warext/Portfolio/_data/template_modifications.xml')
          text = path.read_text(encoding='utf-8')

          old_assets = '<xf:title>{$portfolio.title}</xf:title><xf:css src="wrxt_portfolio.less" /><xf:css src="message.less" /><xf:css src="bb_code.less" />'
          new_assets = '<xf:title>{$portfolio.title}</xf:title><xf:css src="wrxt_portfolio.less" /><xf:css src="message.less" /><xf:css src="bb_code.less" /><xf:js src="xf/message.js" min="1" />'
          if old_assets in text:
              text = text.replace(old_assets, new_assets, 1)

          marker = '''        <xf:form action="{{ link('portfolyo/calisma/comment', $portfolio) }}"
                 ajax="true"
                 class="block js-quickReply"
                 data-xf-init="ajax-submit">'''
          if marker in text:
              start = text.index(marker)
              end_marker = '        </xf:form>'
              end = text.index(end_marker, start) + len(end_marker)
              native = '''        <xf:form action="{{ link('portfolyo/calisma/comment', $portfolio) }}"
                 ajax="true"
                 class="block js-quickReply"
                 data-xf-init="quick-reply ajax-submit"
                 data-preview-url="{{ link('portfolyo-yorum-onizle', null, {'portfolio_id': $portfolio.portfolio_id}) }}">
            <div class="block-container">
                <div class="block-body">
                    <xf:macro template="quick_reply_macros"
                              name="body"
                              arg-showPreviewButton="true"
                              arg-submitText="Yorum gönder"
                              arg-minHeight="140"
                              arg-placeholder="Yorumunuzu yazın..." />
                </div>
            </div>
        </xf:form>'''
              text = text[:start] + native + text[end:]

          if 'template="quick_reply_macros"' not in text:
              raise SystemExit('Native quick_reply_macros dönüşümü uygulanamadı')
          if '<xf:js src="xf/message.js" min="1" />' not in text:
              raise SystemExit('xf/message.js eklenemedi')
          if '<xf:editor name="message" placeholder="Yorumunuzu yazın..."' in text:
              raise SystemExit('Eski elle hazırlanmış quick reply editörü hâlâ mevcut')

          path.write_text(text, encoding='utf-8')
          print('Native XenForo quick reply applied')
          PY

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find upload/src/addons/Warext/Portfolio -type f -name '*.php' -print0)

      - name: Validate XML and JSON data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('upload/src/addons/Warext/Portfolio')
          for path in root.rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          for path in (root / '_data').glob('*.xml'):
              ET.parse(path)
          print('JSON/XML validation OK')
          PY

      - name: Validate local template modification anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          data = Path('upload/src/addons/Warext/Portfolio/_data')
          templates_root = ET.parse(data / 'templates.xml').getroot()
          modifications_root = ET.parse(data / 'template_modifications.xml').getroot()
          templates = {node.attrib['title']: (node.text or '') for node in templates_root.findall('template')}
          failed = []
          checked = 0
          for mod in modifications_root.findall('modification'):
              title = mod.attrib.get('template', '')
              if title not in templates:
                  continue
              find_node = mod.find('find')
              needle = find_node.text if find_node is not None else ''
              checked += 1
              if not needle or needle not in templates[title]:
                  failed.append(f"{mod.attrib.get('modification_key')} -> {title}")
          if failed:
              raise SystemExit('Template modification anchor bulunamadı: ' + ', '.join(failed))
          print(f'Local template modification anchors OK ({checked})')
          PY

      - name: Validate XenForo native comments and quick reply
        shell: bash
        run: |
          set -euo pipefail
          FILE='upload/src/addons/Warext/Portfolio/_data/template_modifications.xml'
          grep -q 'class="block block--messages"' "$FILE"
          grep -q 'template="message_macros"' "$FILE"
          grep -q 'name="user_info"' "$FILE"
          grep -q 'class="block js-quickReply"' "$FILE"
          grep -q 'template="quick_reply_macros"' "$FILE"
          grep -q 'name="body"' "$FILE"
          grep -q 'data-xf-init="quick-reply ajax-submit"' "$FILE"
          grep -q 'data-preview-url=' "$FILE"
          grep -q 'xf/message.js' "$FILE"
          grep -q 'message-attribution message-attribution--split' "$FILE"
          if grep -q '<xf:editor name="message" placeholder="Yorumunuzu yazın..."' "$FILE"; then
            echo 'Custom quick-reply editor is still present.' >&2
            exit 1
          fi
          echo 'Native XenForo comments + quick_reply_macros OK'

      - name: Regenerate XenForo file hashes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          upload = Path('upload')
          hash_file = upload / 'src/addons/Warext/Portfolio/hashes.json'
          roots = [upload / 'js/warext/portfolio', upload / 'src/addons/Warext/Portfolio']
          hashes = {}
          for root in roots:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path == hash_file:
                      continue
                  hashes[path.relative_to(upload).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          hash_file.write_text(json.dumps(hashes, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          PY

      - name: Build XenForo install ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          mkdir -p dist
          ZIP="dist/Warext-Studios-XenForo-Portfolyo-Sistemi-${VERSION}.zip"
          rm -f "$ZIP"
          zip -r -9 "$ZIP" README.md upload >/dev/null
          sha256sum "$ZIP" > dist/SHA256SUMS.txt
          unzip -t "$ZIP"

      - name: Commit packaged release
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/src/addons/Warext/Portfolio/_data/template_modifications.xml upload/src/addons/Warext/Portfolio/hashes.json "dist/Warext-Studios-XenForo-Portfolyo-Sistemi-${VERSION}.zip" dist/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Release package already up to date.'
          else
            git commit -m "release: package Portfolyo ${VERSION}"
            git push
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          TAG="v${VERSION}"
          ZIP="dist/Warext-Studios-XenForo-Portfolyo-Sistemi-${VERSION}.zip"
          NOTES="Warext Studios XenForo Portfolyo Sistemi ${VERSION}\n\n- Portfolyo hızlı cevap alanındaki elle hazırlanmış editör HTML'i kaldırıldı\n- XenForo'nun kendi quick_reply_macros::body makrosu doğrudan kullanılıyor\n- xf/message.js ve quick-reply ajax-submit zinciri aktif\n- XenForo native önizleme butonu Portfolyo yorum önizleme endpointine bağlandı\n- Önizleme XF:BbCodePreview üzerinden oluşturuluyor\n- Normal message_macros::user_info postbit ve yorum aksiyonları korunuyor\n- Manuel SQL gerekmiyor"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$ZIP" dist/SHA256SUMS.txt --target main --title "$VERSION" --notes "$NOTES"
          fi
