name: Package Portfolyo Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'upload/**'
      - '!upload/src/addons/Warext/Portfolio/hashes.json'
      - 'README.md'
      - '.github/workflows/package-release.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          with open('upload/src/addons/Warext/Portfolio/addon.json', encoding='utf-8') as f:
              print(json.load(f)['version_string'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find upload/src/addons/Warext/Portfolio -type f -name '*.php' -print0)

      - name: Validate XML and JSON data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('upload/src/addons/Warext/Portfolio')
          for path in root.rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          for path in (root / '_data').glob('*.xml'):
              ET.parse(path)
          print('JSON/XML validation OK')
          PY

      - name: Validate local template modification anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          data = Path('upload/src/addons/Warext/Portfolio/_data')
          templates_root = ET.parse(data / 'templates.xml').getroot()
          modifications_root = ET.parse(data / 'template_modifications.xml').getroot()
          templates = {node.attrib['title']: (node.text or '') for node in templates_root.findall('template')}
          failed = []
          checked = 0
          for mod in modifications_root.findall('modification'):
              title = mod.attrib.get('template', '')
              if title not in templates:
                  continue
              find_node = mod.find('find')
              needle = find_node.text if find_node is not None else ''
              checked += 1
              if not needle or needle not in templates[title]:
                  failed.append(f"{mod.attrib.get('modification_key')} -> {title}")
          if failed:
              raise SystemExit('Template modification anchor bulunamadı: ' + ', '.join(failed))
          print(f'Local template modification anchors OK ({checked})')
          PY

      - name: Validate XenForo native comments and quick reply
        shell: bash
        run: |
          set -euo pipefail
          MOD='upload/src/addons/Warext/Portfolio/_data/template_modifications.xml'
          TYPES='upload/src/addons/Warext/Portfolio/_data/content_type_fields.xml'
          ROUTES='upload/src/addons/Warext/Portfolio/_data/routes.xml'
          CTRL='upload/src/addons/Warext/Portfolio/Pub/Controller/ItemNative.php'
          PREVIEW='upload/src/addons/Warext/Portfolio/Pub/Controller/CommentPreview.php'
          ENTITY='upload/src/addons/Warext/Portfolio/Entity/Comment.php'
          HANDLER='upload/src/addons/Warext/Portfolio/Attachment/Comment.php'
          MIGRATION='upload/src/addons/Warext/Portfolio/Setup/CommentAttachmentUpgradeTrait.php'

          grep -q 'class="block block--messages"' "$MOD"
          grep -q 'template="message_macros"' "$MOD"
          grep -q 'name="user_info"' "$MOD"
          grep -q 'name="attachments"' "$MOD"
          grep -q 'class="block js-quickReply"' "$MOD"
          grep -q 'template="quick_reply_macros"' "$MOD"
          grep -q 'name="body"' "$MOD"
          grep -q 'arg-attachmentData="{$attachmentData}"' "$MOD"
          grep -q 'data-xf-init="attachment-manager quick-reply"' "$MOD"
          grep -q "data-message-container=\"div\[data-type='comment'\] .js-replyNewMessageContainer\"" "$MOD"
          grep -q 'data-preview-url=' "$MOD"
          grep -q 'xf/message.js' "$MOD"
          grep -q 'message-attribution message-attribution--split' "$MOD"

          grep -q 'content_type="wrxt_portfolio_comment" field_name="attachment_handler_class"' "$TYPES"
          grep -q 'Warext\\Portfolio\\Attachment\\Comment' "$TYPES"
          grep -q 'controller="Warext\\Portfolio:ItemNative"' "$ROUTES"
          grep -q "getEditorData(" "$CTRL"
          grep -q "associateAttachmentsWithContent(" "$CTRL"
          grep -q "attachment_hash" "$CTRL"
          grep -q "findAttachmentsByTempHash" "$PREVIEW"
          grep -q "isAttachmentEmbedded" "$ENTITY"
          grep -q "canViewAttachments" "$ENTITY"
          grep -q "class Comment extends AbstractHandler" "$HANDLER"
          grep -q "upgrade1010107Step1" "$MIGRATION"
          grep -q "attach_count" "$MIGRATION"

          if grep -q '<xf:editor name="message" placeholder="Yorumunuzu yazın..."' "$MOD"; then
            echo 'Custom quick-reply editor is still present.' >&2
            exit 1
          fi
          if grep -q 'data-xf-init="quick-reply ajax-submit"' "$MOD"; then
            echo 'Legacy Portfolyo quick-reply init is still present.' >&2
            exit 1
          fi

          echo 'Native XenForo comments + quick reply + attachment manager OK'

      - name: Regenerate XenForo file hashes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          upload = Path('upload')
          hash_file = upload / 'src/addons/Warext/Portfolio/hashes.json'
          roots = [upload / 'js/warext/portfolio', upload / 'src/addons/Warext/Portfolio']
          hashes = {}
          for root in roots:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path == hash_file:
                      continue
                  hashes[path.relative_to(upload).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          hash_file.write_text(json.dumps(hashes, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          PY

      - name: Build XenForo install ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          mkdir -p dist
          ZIP="dist/Warext-Studios-XenForo-Portfolyo-Sistemi-${VERSION}.zip"
          rm -f "$ZIP"
          zip -r -9 "$ZIP" README.md upload >/dev/null
          sha256sum "$ZIP" > dist/SHA256SUMS.txt
          unzip -t "$ZIP"

      - name: Commit packaged release
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/src/addons/Warext/Portfolio/hashes.json "dist/Warext-Studios-XenForo-Portfolyo-Sistemi-${VERSION}.zip" dist/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Release package already up to date.'
          else
            git commit -m "release: package Portfolyo ${VERSION}"
            git push
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          TAG="v${VERSION}"
          ZIP="dist/Warext-Studios-XenForo-Portfolyo-Sistemi-${VERSION}.zip"
          NOTES="Warext Studios XenForo Portfolyo Sistemi ${VERSION}\n\n- Portfolyo yorum alanı normal XenForo attachment-manager quick-reply zincirine bağlandı\n- XenForo quick_reply_macros::body gerçek attachmentData ile çalışıyor\n- Dosya ekle kontrolü XenForo çekirdek attachment manager tarafından oluşturuluyor\n- wrxt_portfolio_comment için gerçek attachment content type ve handler eklendi\n- Geçici ekler gönderimde güvenli şekilde yoruma ilişkilendiriliyor\n- Önizleme geçici ekleri destekliyor\n- Gönderilmiş ekler message_macros::attachments ile gösteriliyor\n- Eski kurulumlarda attach_count alanı otomatik migration ile ekleniyor\n- Manuel SQL gerekmiyor"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$ZIP" dist/SHA256SUMS.txt --target main --title "$VERSION" --notes "$NOTES"
          fi
